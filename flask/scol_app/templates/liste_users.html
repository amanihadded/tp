<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Liste des utilisateurs</title>
</head>
<body>

<h1>Liste des utilisateurs</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <p><b>{{ message }}</b></p>
    {% endfor %}
{% endwith %}

<table border="1" cellpadding="5">
    <tr>
        <th>Id</th><th>Username</th><th>Email</th>
    </tr>
    {% for u in users %}
    <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
    </tr>
    {% endfor %}
</table>

<p><a href="{{ url_for('add_user') }}">Ajouter un utilisateur</a></p>

</body>
</html>
